[colors]
background 	= #0a0a0f
foreground 	= #d9e0ee
primary		= #00d9ff
secondary	= #ff007c
alert		= #ff007c

[bar/main]
width = 100%
height = 30
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}
separator = " | "

line-size = 3
line-color = ${colors.primary}

font-0 = "JetBrainsMono Nerd Font:size=11;2"
font-1 = "JetBrainsMono Nerd Font:size=12;2"

modules-left = i3
modules-center = date
modules-right = cpu memory pulseaudio wlan

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-background = ${colors.foreground}
label-unfocused-foreground = ${colors.background}
label-unfocused-padding = 1
label-visible = %name%
label-visible-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 1
time = "%a %d // %H:%M:%S"
format = <label>
label = %time%
label-foreground = ${colors.primary}

[module/cpu]
type = internal/cpu
interval = 0.6
format = <label>
label = CPU - %percentage%%
label-foreground = ${colors.primary}

[module/memory]
type = internal/memory
interval = 3.1
format = <label>
label = MEM - %percentage_used%% RAM, %percentage_swap_used%% SWP
label-foreground = ${colors.primary}

[module/pulseaudio]
type = internal/pulseaudio
format = <label>
label-volume = "AUD %percentage%%"
label-volume-foreground = ${colors.primary}
label-muted = "AUD MUT"
label-muted-foreground = ${colors.alert}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging = "CHRG <percentage>%"
format-discharging = "DCHG <percentage>%"
format-full = "BAT FULL"
label-foreground = ${colors.secondary}

[module/wlan]
type = internal/network
interface = wlan0
interval = 1.5
format = <label>
label-connected = "WLAN %netspeed%"
label-connected-foreground = ${colors.primary}
label-disconnected = "WLAN Disconnected"
label-disconnected-background = ${colors.alert}
